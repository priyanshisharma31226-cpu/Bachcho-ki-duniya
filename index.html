<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>बच्चों की दुनिया • 40 Things (What Is This?)</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f59e0b" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #fffbeb; --card: #ffffff; --primary: #f59e0b; --primary-dark: #b45309;
      --secondary: #10b981; --blue: #2563eb; --text: #1e293b; --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Fredoka', 'Noto Sans Devanagari', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: linear-gradient(135deg, #f59e0b, #ea580c); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 20; }
    .title-wrap h1 { font-size: 1.15rem; line-height: 1.2; }
    .title-wrap p { font-size: 0.78rem; opacity: 0.95; }
    #installBtn { display: none; background: #fff; color: #ea580c; border: none; padding: 8px 13px; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 0.82rem; cursor: pointer; }
    .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; max-width: 680px; width: 100%; margin: 0 auto; }
    .cat-btn { border: 2px solid #fde68a; background: #fff; color: var(--text); padding: 8px 14px; border-radius: 999px; font-family: inherit; font-size: 0.86rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .cat-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    main { flex: 1; max-width: 680px; width: 100%; margin: 0 auto; padding: 12px 16px 24px; }
    .flashcard { background: var(--card); border-radius: 24px; padding: 16px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); border: 3px solid #fef3c7; }
    .counter { text-align: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
    .photo-box { width: 100%; aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; background: #fef3c7; margin-bottom: 14px; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .question-box { text-align: center; background: #fffbeb; border-radius: 16px; padding: 12px; margin-bottom: 14px; }
    .q-hindi { font-size: 1.18rem; font-weight: 700; color: var(--primary-dark); }
    .q-eng { font-size: 1.05rem; font-weight: 600; color: var(--blue); margin-top: 2px; }
    .answer-box { display: none; text-align: center; background: #ecfdf5; border: 2px solid #a7f3d0; border-radius: 16px; padding: 14px; margin-bottom: 14px; }
    .answer-box.show { display: block; }
    .a-hindi { font-size: 1.3rem; font-weight: 700; color: #065f46; }
    .a-eng { font-size: 1.15rem; font-weight: 700; color: #047857; margin-top: 2px; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .btn { border: none; border-radius: 14px; padding: 12px 14px; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-ask { background: var(--blue); color: #fff; grid-column: span 2; }
    .btn-ans-hi { background: var(--secondary); color: #fff; }
    .btn-ans-en { background: #0ea5e9; color: #fff; }
    .nav-row { display: flex; justify-content: space-between; gap: 10px; }
    .btn-nav { flex: 1; background: #fef3c7; color: var(--primary-dark); }
    .btn-next { flex: 1; background: var(--primary); color: #fff; }
  </style>
</head>
