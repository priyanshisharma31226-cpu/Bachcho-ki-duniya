
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#673ab7">
<title>Bachcho Ki Duniya</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 text-align:center;
 background:linear-gradient(135deg,#e1f5fe,#fce4ec);
 color:#333;
}
header{
 background:#673ab7;color:white;
 padding:22px 10px;
}
header h1{margin:0;font-size:27px}
header p{margin:8px}
.categories{
 display:flex;flex-wrap:wrap;
 justify-content:center;gap:8px;
 padding:15px 8px;
}
button{
 border:0;border-radius:25px;
 padding:12px 16px;
 font-size:15px;font-weight:bold;
 cursor:pointer;
}
.cat{background:white;color:#673ab7}
.cat.active{background:#ff9800;color:white}
.card{
 width:92%;max-width:430px;
 margin:10px auto;background:white;
 padding:16px;border-radius:22px;
 box-shadow:0 5px 18px #9995;
}
.picture{
 height:270px;width:100%;
 border-radius:18px;
 display:flex;
 justify-content:center;
 align-items:center;
 background:linear-gradient(135deg,#fff9c4,#f8bbd0);
 border:3px solid white;
 overflow:hidden;
}
.picture svg{width:100%;height:100%}
h2{font-size:30px;color:#673ab7;margin:14px 0 5px}
h3{font-size:22px;margin:5px}
.counter{color:#777;margin:12px}
.controls{
 display:flex;justify-content:center;
 flex-wrap:wrap;gap:10px;margin:14px 0;
}
.controls button{background:#673ab7;color:white}
.controls .voice{background:#009688}
.controls .random{background:#ff9800}
footer{padding:20px;color:#666}
</style>
</head>

<body>
<header>
<h1>🌈 बच्चों की दुनिया 🌈</h1>
<p>Learn With Fun • खेल-खेल में सीखें</p>
</header>

<div class="categories">
<button class="cat active" onclick="change('Animals',this)">🐘 Animals</button>
<button class="cat" onclick="change('Birds',this)">🦜 Birds</button>
<button class="cat" onclick="change('Insects',this)">🦋 Insects</button>
<button class="cat" onclick="change('Flowers',this)">🌸 Flowers</button>
</div>

<div class="card">
<div class="picture" id="picture"></div>
<h2 id="hindi"></h2>
<h3 id="english"></h3>
<div class="counter" id="counter"></div>

<div class="controls">
<button onclick="previous()">⬅ Previous</button>
<button class="voice" onclick="speak()">🔊 सुनें</button>
<button onclick="next()">Next ➡</button>
</div>
<div class="controls">
<button class="random" onclick="randomItem()">🎲 Random</button>
</div>
</div>

<footer>⭐ Learn Something New Every Day ⭐</footer>

<script>
const data={
Animals:[
["हाथी","Elephant","🐘"],["शेर","Lion","🦁"],
["बाघ","Tiger","🐅"],["बंदर","Monkey","🐒"],
["हिरण","Deer","🦌"],["जिराफ","Giraffe","🦒"],
["ज़ेब्रा","Zebra","🦓"],["खरगोश","Rabbit","🐇"],
["कुत्ता","Dog","🐕"],["बिल्ली","Cat","🐈"]
],
Birds:[
["तोता","Parrot","🦜"],["मोर","Peacock","🦚"],
["कबूतर","Pigeon","🕊️"],["गौरैया","Sparrow","🐦"],
["उल्लू","Owl","🦉"],["बतख","Duck","🦆"],
["मुर्गी","Hen","🐔"],["हंस","Swan","🦢"],
["कौआ","Crow","🐦‍⬛"],["ईगल","Eagle","🦅"]
],
Insects:[
["तितली","Butterfly","🦋"],["मधुमक्खी","Honeybee","🐝"],
["चींटी","Ant","🐜"],["लेडीबर्ड","Ladybird","🐞"],
["टिड्डा","Grasshopper","🦗"],["मच्छर","Mosquito","🦟"],
["मक्खी","Housefly","🪰"],["ड्रैगनफ्लाई","Dragonfly","🪲"],
["इल्ली","Caterpillar","🐛"],["भृंग","Beetle","🪲"]
],
Flowers:[
["गुलाब","Rose","🌹"],["कमल","Lotus","🪷"],
["सूरजमुखी","Sunflower","🌻"],["गेंदा","Marigold","🌼"],
["गुड़हल","Hibiscus","🌺"],["चमेली","Jasmine","🌼"],
["गुलदाउदी","Chrysanthemum","💐"],["ट्यूलिप","Tulip","🌷"],
["लैवेंडर","Lavender","💜"],["ऑर्किड","Orchid","🌸"]
]
};

let category="Animals";
let index=0;

function show(){
 let item=data[category][index];
 document.getElementById("hindi").textContent=item[0];
 document.getElementById("english").textContent=item[1];
 document.getElementById("counter").textContent=
 "Picture "+(index+1)+" of "+data[category].length;

 let colors=["#fff3e0","#e1f5fe","#f3e5f5","#e8f5e9"];
 let color=colors[index%4];

 document.getElementById("picture").innerHTML=`
 <svg xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 400 270">
 <rect width="400" height="270" rx="20" fill="${color}"/>
 <circle cx="200" cy="130" r="100" fill="#ffffff" opacity=".65"/>
 <text x="200" y="175" text-anchor="middle"
 font-size="135">${item[2]}</text>
 <text x="200" y="245" text-anchor="middle"
 font-size="17" fill="#673ab7"
 font-weight="bold">${item[1]}</text>
 </svg>`;
}

function change(name,btn){
 category=name;index=0;
 document.querySelectorAll(".cat").forEach(
 b=>b.classList.remove("active"));
 btn.classList.add("active");
 speechSynthesis.cancel();
 show();
}
function next(){
 index=(index+1)%data[category].length;
 speechSynthesis.cancel();show();
}
function previous(){
 index=(index-1+data[category].length)%data[category].length;
 speechSynthesis.cancel();show();
}
function randomItem(){
 index=Math.floor(Math.random()*data[category].length);
 speechSynthesis.cancel();show();
}
function speak(){
 speechSynthesis.cancel();
 let item=data[category][index];
 let a=new SpeechSynthesisUtterance(item[0]);
 a.lang="hi-IN";a.rate=.85;
 let b=new SpeechSynthesisUtterance(item[1]);
 b.lang="en-IN";b.rate=.85;
 speechSynthesis.speak(a);
 speechSynthesis.speak(b);
}
show();
</script>
</body>
</html>
