<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>बच्चों की दुनिया • 40 Things</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root {
      --bg: #fffbeb;
      --card: #ffffff;
      --primary: #f59e0b;
      --primary-dark: #b45309;
      --secondary: #10b981;
      --blue: #2563eb;
      --text: #1e293b;
      --muted: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: system-ui, -apple-system, "Noto Sans Devanagari", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title-wrap h1 {
      font-size: 1.15rem;
      line-height: 1.25;
    }
    .title-wrap p {
      font-size: 0.78rem;
      opacity: 0.95;
      margin-top: 2px;
    }
    #installBtn {
      display: none;
      background: #ffffff;
      color: #ea580c;
      border: none;
      padding: 8px 13px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .cat-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px 4px;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }
    .cat-btn {
      border: 2px solid #fde68a;
      background: #ffffff;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    main {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 16px 24px;
    }
    .flashcard {
      background: var(--card);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 3px solid #fef3c7;
    }
    .counter {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 700;
    }

    /* Pure HTML/CSS Visual Stage - Never blocked by image/data-URI filters */
    .visual-stage {
      width: 100%;
      min-height: 230px;
      border-radius: 18px;
      padding: 20px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 2px solid rgba(15, 23, 42, 0.08);
    }
    .stage-animals { background: linear-gradient(135deg, #fef3c7, #fde68a); }
    .stage-birds { background: linear-gradient(135deg, #e0f2fe, #bae6fd); }
    .stage-insects { background: linear-gradient(135deg, #dcfce7, #bbf7d0); }
    .stage-flowers { background: linear-gradient(135deg, #fce7f3, #fbcfe8); }

    .cat-pill {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #ffffff;
      background: #ea580c;
      margin-bottom: 12px;
      letter-spacing: 0.4px;
    }
    .stage-birds .cat-pill { background: #0284c7; }
    .stage-insects .cat-pill { background: #16a34a; }
    .stage-flowers .cat-pill { background: #db2777; }

    .visual-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      padding: 10px;
    }
    .vis-en {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.15;
    }
    .vis-hi {
      font-size: 1.15rem;
      font-weight: 700;
      color: #334155;
      margin-top: 6px;
      line-height: 1.2;
    }
    .vis-sub {
      margin-top: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
    }

    .question-box {
      text-align: center;
      background: #fffbeb;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .q-hindi {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .q-eng {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--blue);
      margin-top: 2px;
    }
    .answer-box {
      display: none;
      text-align: center;
      background: #ecfdf5;
      border: 2px solid #a7f3d0;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .answer-box.show {
      display: block;
    }
    .a-hindi {
      font-size: 1.32rem;
      font-weight: 700;
      color: #065f46;
    }
    .a-eng {
      font-size: 1.15rem;
      font-weight: 700;
      color: #047857;
      margin-top: 2px;
    }
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-ask {
      background: var(--blue);
      color: #ffffff;
      grid-column: span 2;
    }
    .btn-ans-hi {
      background: var(--secondary);
      color: #ffffff;
    }
    .btn-ans-en {
      background: #0ea5e9;
      color: #ffffff;
    }
    .nav-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .btn-nav {
      flex: 1;
      background: #fef3c7;
      color: var(--primary-dark);
    }
    .btn-next {
      flex: 1;
      background: var(--primary);
      color: #ffffff;
    }
    .voice-note {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-wrap">
      <h1>बच्चों की दुनिया • 40 Things</h1>
      <p>10 Animals • 10 Birds • 10 Insects • 10 Flowers</p>
    </div>
    <button id="installBtn">📲 Install App</button>
  </header>

  <div class="cat-bar" id="catBar"></div>

  <main>
    <div class="flashcard" id="cardContainer"></div>
    <div class="voice-note" id="voiceStatus">🔊 आवाज के लिए किसी भी बटन पर टैप करें</div>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }

    var deferredPrompt = null;
    var installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = "inline-block";
    });
    if (installBtn) {
      installBtn.addEventListener("click", function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          installBtn.style.display = "none";
          deferredPrompt = null;
        });
      });
    }

    var items = [
      { category: "Animals", hindiName: "कुत्ता", engName: "Dog" },
      { category: "Animals", hindiName: "बिल्ली", engName: "Cat" },
      { category: "Animals", hindiName: "गाय", engName: "Cow" },
      { category: "Animals", hindiName: "शेर", engName: "Lion" },
      { category: "Animals", hindiName: "हाथी", engName: "Elephant" },
      { category: "Animals", hindiName: "घोड़ा", engName: "Horse" },
      { category: "Animals", hindiName: "बाघ", engName: "Tiger" },
      { category: "Animals", hindiName: "खरगोश", engName: "Rabbit" },
      { category: "Animals", hindiName: "बंदर", engName: "Monkey" },
      { category: "Animals", hindiName: "हिरण", engName: "Deer" },

      { category: "Common Birds", hindiName: "मोर", engName: "Peacock" },
      { category: "Common Birds", hindiName: "गौरैया", engName: "Sparrow" },
      { category: "Common Birds", hindiName: "कौआ", engName: "Crow" },
      { category: "Common Birds", hindiName: "तोता", engName: "Parrot" },
      { category: "Common Birds", hindiName: "कबूतर", engName: "Pigeon" },
      { category: "Common Birds", hindiName: "चील / बाज़", engName: "Eagle" },
      { category: "Common Birds", hindiName: "उल्लू", engName: "Owl" },
      { category: "Common Birds", hindiName: "बतख", engName: "Duck" },
      { category: "Common Birds", hindiName: "हंस", engName: "Swan" },
      { category: "Common Birds", hindiName: "किंगफ़िशर", engName: "Kingfisher" },

      { category: "Insects", hindiName: "तितली", engName: "Butterfly" },
      { category: "Insects", hindiName: "मधुमक्खी", engName: "Honeybee" },
      { category: "Insects", hindiName: "चींटी", engName: "Ant" },
      { category: "Insects", hindiName: "लेडीबग", engName: "Ladybug" },
      { category: "Insects", hindiName: "व्याध पतंग", engName: "Dragonfly" },
      { category: "Insects", hindiName: "टिड्डा", engName: "Grasshopper" },
      { category: "Insects", hindiName: "भृंग / बीटल", engName: "Beetle" },
      { category: "Insects", hindiName: "पतंगा", engName: "Moth" },
      { category: "Insects", hindiName: "मच्छर", engName: "Mosquito" },
      { category: "Insects", hindiName: "मकड़ी", engName: "Spider" },

      { category: "Flowers", hindiName: "गुलाब", engName: "Rose" },
      { category: "Flowers", hindiName: "कमल", engName: "Lotus" },
      { category: "Flowers", hindiName: "सूरजमुखी", engName: "Sunflower" },
      { category: "Flowers", hindiName: "गेंदा", engName: "Marigold" },
      { category: "Flowers", hindiName: "चमेली", engName: "Jasmine" },
      { category: "Flowers", hindiName: "गुड़हल", engName: "Hibiscus" },
      { category: "Flowers", hindiName: "लिली", engName: "Lily" },
      { category: "Flowers", hindiName: "ट्यूलिप", engName: "Tulip" },
      { category: "Flowers", hindiName: "डेज़ी", engName: "Daisy" },
      { category: "Flowers", hindiName: "ऑर्किड", engName: "Orchid" }
    ];

    var categories = ["All", "Animals", "Common Birds", "Insects", "Flowers"];
    var catLabels = {
      "All": "सभी (40) • All",
      "Animals": "जानवर (10) • Animals",
      "Common Birds": "पक्षी (10) • Birds",
      "Insects": "कीड़े (10) • Insects",
      "Flowers": "फूल (10) • Flowers"
    };
    var activeCat = "All";
    var index = 0;
    var showAns = false;

    function getFilteredItems() {
      return activeCat === "All"
        ? items
        : items.filter(function (i) { return i.category === activeCat; });
    }

    function setVoiceStatus(msg) {
      var el = document.getElementById("voiceStatus");
      if (el) el.textContent = msg;
    }

    function speakSweetChildVoice(text, lang) {
      try {
        if (!("speechSynthesis" in window)) {
          setVoiceStatus("ℹ️ इस ब्राउज़र में स्पीच उपलब्ध नहीं है");
          return;
        }
        window.speechSynthesis.cancel();
        var utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        utter.pitch = 1.45;
        utter.rate = 0.92;
        var voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        var prefix = (lang || "en").slice(0, 2).toLowerCase();
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(prefix) === 0) {
            utter.voice = voices[i];
            break;
          }
        }
        utter.onstart = function () { setVoiceStatus("🔊 बोल रहा है: " + text); };
        utter.onend = function () { setVoiceStatus("🔊 किसी भी बटन पर टैप करके सुनें"); };
        utter.onerror = function () { setVoiceStatus("ℹ️ फोन में Hindi/English TTS voice ऑन रखें"); };
        window.speechSynthesis.speak(utter);
      } catch (e) {
        setVoiceStatus("ℹ️ आवाज चलाने में दिक्कत आई");
      }
    }

    function askQuestionVoice() {
      speakSweetChildVoice("बच्चों यह क्या है?", "hi-IN");
      setTimeout(function () {
        speakSweetChildVoice("What is this?", "en-US");
      }, 1500);
    }

    function revealAnswer(mode) {
      var item = getFilteredItems()[index];
      showAns = true;
      renderCard();
      if (mode === "hi") {
        speakSweetChildVoice("यह " + item.hindiName + " है!", "hi-IN");
      } else {
        speakSweetChildVoice("This is a " + item.engName + "!", "en-US");
      }
    }

    function renderCategories() {
      var bar = document.getElementById("catBar");
      if (!bar) return;
      var html = "";
      for (var i = 0; i < categories.length; i++) {
        var cat = categories[i];
        var cls = activeCat === cat ? "cat-btn active" : "cat-btn";
        html += '<button class="' + cls + '" onclick="selectCat(\'' + cat + '\')">' + catLabels[cat] + "</button>";
      }
      bar.innerHTML = html;
    }

    function selectCat(cat) {
      activeCat = cat;
      index = 0;
      showAns = false;
      renderCategories();
      renderCard();
    }

    function nextCard() {
      index = (index + 1) % getFilteredItems().length;
      showAns = false;
      renderCard();
      askQuestionVoice();
    }

    function prevCard() {
      var len = getFilteredItems().length;
      index = (index - 1 + len) % len;
      showAns = false;
      renderCard();
      askQuestionVoice();
    }

    function getStageClass(category) {
      if (category === "Common Birds") return "stage-birds";
      if (category === "Insects") return "stage-insects";
      if (category === "Flowers") return "stage-flowers";
      return "stage-animals";
    }

    function renderCard() {
      var list = getFilteredItems();
      var item = list[index] || items[0];
      var container = document.getElementById("cardContainer");
      if (!container) return;

      container.innerHTML =
        '<div class="counter">' + catLabels[item.category] + " • " + (index + 1) + " / " + list.length + "</div>" +
        '<div class="visual-stage ' + getStageClass(item.category) + '">' +
          '<div class="cat-pill">' + catLabels[item.category] + "</div>" +
          '<div class="visual-circle">' +
            '<div class="vis-en">' + item.engName + "</div>" +
            '<div class="vis-hi">' + item.hindiName + "</div>" +
          "</div>" +
          '<div class="vis-sub">जवाब देखने के लिए नीचे हिंदी या English बटन दबाएं</div>' +
        "</div>" +
        '<div class="question-box">' +
          '<div class="q-hindi">बच्चों यह क्या है?</div>' +
          '<div class="q-eng">What is this?</div>' +
        "</div>" +
        '<div class="answer-box ' + (showAns ? "show" : "") + '">' +
          '<div class="a-hindi">यह ' + item.hindiName + " है</div>" +
          '<div class="a-eng">This is a ' + item.engName + "</div>" +
        "</div>" +
        '<div class="action-grid">' +
          '<button class="btn btn-ask" onclick="askQuestionVoice()">🔊 सवाल सुनें (Ask Question)</button>' +
          '<button class="btn btn-ans-hi" onclick="revealAnswer(\'hi\')">🗣️ जवाब (हिंदी)</button>' +
          '<button class="btn btn-ans-en" onclick="revealAnswer(\'en\')">🗣️ Answer (English)</button>' +
        "</div>" +
        '<div class="nav-row">' +
          '<button class="btn btn-nav" onclick="prevCard()">← पिछला</button>' +
          '<button class="btn btn-next" onclick="nextCard()">अगला →</button>' +
        "</div>";
    }

    if (window.speechSynthesis && window.speechSynthesis.addEventListener) {
      window.speechSynthesis.addEventListener("voiceschanged", function () {});
    }

    renderCategories();
    renderCard();
  </script>
</body>
</html>
