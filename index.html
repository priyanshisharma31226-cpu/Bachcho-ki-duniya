<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>बच्चों की दुनिया • Video Learning App</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root {
      --bg: #fffbeb;
      --card: #ffffff;
      --primary: #f59e0b;
      --primary-dark: #b45309;
      --secondary: #10b981;
      --blue: #2563eb;
      --text: #1e293b;
      --muted: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: system-ui, -apple-system, "Noto Sans Devanagari", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title-wrap h1 { font-size: 1.12rem; line-height: 1.25; }
    .title-wrap p { font-size: 0.76rem; opacity: 0.95; margin-top: 2px; }
    #installBtn {
      display: none;
      background: #ffffff;
      color: #ea580c;
      border: none;
      padding: 7px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .cat-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px 4px;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }
    .cat-btn {
      border: 2px solid #fde68a;
      background: #ffffff;
      color: var(--text);
      padding: 7px 13px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    main {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 16px 24px;
    }

    .flashcard {
      background: var(--card);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 3px solid #fef3c7;
    }

    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .auto-toggle {
      border: none;
      border-radius: 999px;
      padding: 5px 12px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      background: #e2e8f0;
      color: #1e293b;
    }
    .auto-toggle.on {
      background: #16a34a;
      color: #ffffff;
    }

    .photo-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      background: #fef3c7;
      margin-bottom: 12px;
      position: relative;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .img-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      padding: 16px;
      text-align: center;
    }
    .img-fallback strong {
      font-size: 1.6rem;
      color: #0f172a;
    }
    .img-fallback span {
      font-size: 1.25rem;
      color: #b45309;
      margin-top: 6px;
      font-weight: 700;
    }

    .question-box {
      text-align: center;
      background: #fffbeb;
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .q-hindi {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .answer-box {
      display: none;
      text-align: center;
      background: #ecfdf5;
      border: 2px solid #a7f3d0;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .answer-box.show {
      display: block;
    }
    .a-hindi {
      font-size: 1.28rem;
      font-weight: 700;
      color: #065f46;
    }
    .a-eng {
      font-size: 1.12rem;
      font-weight: 700;
      color: #047857;
      margin-top: 2px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-replay {
      background: var(--blue);
      color: #ffffff;
    }
    .btn-next {
      background: var(--primary);
      color: #ffffff;
    }

    .status-bar {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-wrap">
      <h1>बच्चों की दुनिया • Video Mode</h1>
      <p>10 Animals • 10 Birds • 10 Insects • 10 Flowers</p>
    </div>
    <button id="installBtn">📲 Install</button>
  </header>

  <div class="cat-bar" id="catBar"></div>

  <main>
    <div class="flashcard" id="cardContainer"></div>
    <div class="status-bar" id="statusBar">🔊 किसी भी बटन पर टैप करें</div>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }

    var deferredPrompt = null;
    var installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = "inline-block";
    });
    if (installBtn) {
      installBtn.addEventListener("click", function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          installBtn.style.display = "none";
          deferredPrompt = null;
        });
      });
    }

    // Reliable Wikimedia Commons Special:FilePath URLs (fast, public, no API key needed)
    function wikiImg(fileName) {
      return "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(fileName) + "?width=800";
    }

    var items = [
      // 10 Animals
      { category: "Animals", hindiName: "कुत्ता", engName: "Dog", img: wikiImg("Golden_retriever_eating_paws.jpg") },
      { category: "Animals", hindiName: "बिल्ली", engName: "Cat", img: wikiImg("Cat_poster_1.jpg") },
      { category: "Animals", hindiName: "गाय", engName: "Cow", img: wikiImg("Cow_female_black_white.jpg") },
      { category: "Animals", hindiName: "शेर", engName: "Lion", img: wikiImg("Lion_waiting_in_Namibia.jpg") },
      { category: "Animals", hindiName: "हाथी", engName: "Elephant", img: wikiImg("African_Bush_Elephant.jpg") },
      { category: "Animals", hindiName: "घोड़ा", engName: "Horse", img: wikiImg("Red_mare.jpg") },
      { category: "Animals", hindiName: "बाघ", engName: "Tiger", img: wikiImg("Walking_tiger_female.jpg") },
      { category: "Animals", hindiName: "खरगोश", engName: "Rabbit", img: wikiImg("Oryctolagus_cuniculus_Rcdo.jpg") },
      { category: "Animals", hindiName: "बंदर", engName: "Monkey", img: wikiImg("Macaca_fuscata_in_Arashiyama.jpg") },
      { category: "Animals", hindiName: "हिरण", engName: "Deer", img: wikiImg("Cervus_elaphus_lucasi.jpg") },

      // 10 Common Birds
      { category: "Common Birds", hindiName: "मोर", engName: "Peacock", img: wikiImg("Peacock_Plumage.jpg") },
      { category: "Common Birds", hindiName: "गौरैया", engName: "Sparrow", img: wikiImg("House_sparrow_male_in_profile.jpg") },
      { category: "Common Birds", hindiName: "कौआ", engName: "Crow", img: wikiImg("Corvus_brachyrhynchos_01.jpg") },
      { category: "Common Birds", hindiName: "तोता", engName: "Parrot", img: wikiImg("Rose-ringed_parakeet_in_Hyderabad.jpg") },
      { category: "Common Birds", hindiName: "कबूतर", engName: "Pigeon", img: wikiImg("Feral_pigeon_columba_livia.jpg") },
      { category: "Common Birds", hindiName: "चील / बाज़", engName: "Eagle", img: wikiImg("Bald_Eagle_Portrait.jpg") },
      { category: "Common Birds", hindiName: "उल्लू", engName: "Owl", img: wikiImg("Bubo_bubo_02.jpg") },
      { category: "Common Birds", hindiName: "बतख", engName: "Duck", img: wikiImg("Anas_platyrhynchos_male_female_quadrat.jpg") },
      { category: "Common Birds", hindiName: "हंस", engName: "Swan", img: wikiImg("Cygnus_olor_6_(B).jpg") },
      { category: "Common Birds", hindiName: "किंगफ़िशर", engName: "Kingfisher", img: wikiImg("Common_Kingfisher_Alcedo_atthis.jpg") },

      // 10 Insects
      { category: "Insects", hindiName: "तितली", engName: "Butterfly", img: wikiImg("Monarch_Butterfly_Danaus_plexippus_Male_2669px.jpg") },
      { category: "Insects", hindiName: "मधुमक्खी", engName: "Honeybee", img: wikiImg("Apis_mellifera_Western_honey_bee.jpg") },
      { category: "Insects", hindiName: "चींटी", engName: "Ant", img: wikiImg("Formica_rufa_ant.jpg") },
      { category: "Insects", hindiName: "लेडीबग", engName: "Ladybug", img: wikiImg("Coccinella_septempunctata_01.jpg") },
      { category: "Insects", hindiName: "व्याध पतंग", engName: "Dragonfly", img: wikiImg("Dragonfly_in_flight.jpg") },
      { category: "Insects", hindiName: "टिड्डा", engName: "Grasshopper", img: wikiImg("Caelifera_01.jpg") },
      { category: "Insects", hindiName: "भृंग / बीटल", engName: "Beetle", img: wikiImg("Stag_beetle_male.jpg") },
      { category: "Insects", hindiName: "पतंगा", engName: "Moth", img: wikiImg("Atlas_moth_female.jpg") },
      { category: "Insects", hindiName: "मच्छर", engName: "Mosquito", img: wikiImg("Aedes_aegypti_CDC_1.jpg") },
      { category: "Insects", hindiName: "मकड़ी", engName: "Spider", img: wikiImg("Araneus_diadematus_01.jpg") },

      // 10 Flowers
      { category: "Flowers", hindiName: "गुलाब", engName: "Rose", img: wikiImg("Red_rose.jpg") },
      { category: "Flowers", hindiName: "कमल", engName: "Lotus", img: wikiImg("Nelumbo_nucifera_open_flower_-_botanic_garden_bloemendaal.jpg") },
      { category: "Flowers", hindiName: "सूरजमुखी", engName: "Sunflower", img: wikiImg("Helianthus_annuus_1409.jpg") },
      { category: "Flowers", hindiName: "गेंदा", engName: "Marigold", img: wikiImg("Tagetes_patula_01.jpg") },
      { category: "Flowers", hindiName: "चमेली", engName: "Jasmine", img: wikiImg("Jasminum_officinale_01.jpg") },
      { category: "Flowers", hindiName: "गुड़हल", engName: "Hibiscus", img: wikiImg("Hibiscus_rosa-sinensis_flower.jpg") },
      { category: "Flowers", hindiName: "लिली", engName: "Lily", img: wikiImg("Lilium_candidum_01.jpg") },
      { category: "Flowers", hindiName: "ट्यूलिप", engName: "Tulip", img: wikiImg("Tulipa_gesneriana_01.jpg") },
      { category: "Flowers", hindiName: "डेज़ी", engName: "Daisy", img: wikiImg("Bellis_perennis_white_(aka).jpg") },
      { category: "Flowers", hindiName: "ऑर्किड", engName: "Orchid", img: wikiImg("Phalaenopsis_aphrodite_01.jpg") }
    ];

    var categories = ["All", "Animals", "Common Birds", "Insects", "Flowers"];
    var catLabels = {
      "All": "सभी (40)",
      "Animals": "जानवर (10)",
      "Common Birds": "पक्षी (10)",
      "Insects": "कीड़े (10)",
      "Flowers": "फूल (10)"
    };

    var activeCat = "All";
    var index = 0;
    var showAns = false;
    var autoVideoMode = false;

    var answerTimer = null;
    var nextCardTimer = null;

    function getFilteredItems() {
      return activeCat === "All"
        ? items
        : items.filter(function (i) { return i.category === activeCat; });
    }

    function clearTimers() {
      if (answerTimer) { clearTimeout(answerTimer); answerTimer = null; }
      if (nextCardTimer) { clearTimeout(nextCardTimer); nextCardTimer = null; }
    }

    function setStatus(msg) {
      var el = document.getElementById("statusBar");
      if (el) el.textContent = msg;
    }

    function speak(text, lang, onDone) {
      try {
        if (!("speechSynthesis" in window)) {
          if (onDone) setTimeout(onDone, 1800);
          return;
        }
        window.speechSynthesis.cancel();
        var utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        utter.pitch = 1.45;
        utter.rate = 0.92;
        var voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        var prefix = (lang || "hi").slice(0, 2).toLowerCase();
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(prefix) === 0) {
            utter.voice = voices[i];
            break;
          }
        }
        utter.onend = function () { if (onDone) onDone(); };
        utter.onerror = function () { if (onDone) onDone(); };
        window.speechSynthesis.speak(utter);
      } catch (e) {
        if (onDone) setTimeout(onDone, 1800);
      }
    }

    function playVideoSequence() {
      clearTimers();
      showAns = false;
      renderCard();

      var list = getFilteredItems();
      var item = list[index] || items[0];

      setStatus("🔊 सवाल: ये क्या है प्यारे बच्चों?");
      speak("ये क्या है प्यारे बच्चों?", "hi-IN");

      answerTimer = setTimeout(function () {
        showAns = true;
        renderCard();
        setStatus("🔊 जवाब: ये " + item.hindiName + " है, " + item.engName);
        speak("ये " + item.hindiName + " है, " + item.engName, "hi-IN", function () {
          if (autoVideoMode) {
            nextCardTimer = setTimeout(function () {
              stepNext();
            }, 2200);
          }
        });
      }, 2500);
    }

    function toggleAutoVideo() {
      autoVideoMode = !autoVideoMode;
      renderCard();
      if (autoVideoMode) {
        setStatus("▶ Auto Video Mode ON: कार्ड अपने आप बदलते रहेंगे");
        playVideoSequence();
      } else {
        clearTimers();
        setStatus("⏸ Auto Video Mode OFF: Next दबाकर बदलें");
      }
    }

    function renderCategories() {
      var bar = document.getElementById("catBar");
      if (!bar) return;
      var html = "";
      for (var i = 0; i < categories.length; i++) {
        var cat = categories[i];
        var cls = activeCat === cat ? "cat-btn active" : "cat-btn";
        html += '<button class="' + cls + '" onclick="selectCat(\'' + cat + '\')">' + catLabels[cat] + "</button>";
      }
      bar.innerHTML = html;
    }

    function selectCat(cat) {
      activeCat = cat;
      index = 0;
      playVideoSequence();
    }

    function stepNext() {
      var list = getFilteredItems();
      index = (index + 1) % list.length;
      playVideoSequence();
    }

    function handleImgError(imgEl, engName, hindiName) {
      var box = imgEl.parentNode;
      if (!box) return;
      box.innerHTML =
        '<div class="img-fallback">' +
          '<strong>' + engName + '</strong>' +
          '<span>' + hindiName + '</span>' +
        '</div>';
    }

    function renderCard() {
      var list = getFilteredItems();
      var item = list[index] || items[0];
      var container = document.getElementById("cardContainer");
      if (!container) return;

      container.innerHTML =
        '<div class="top-meta">' +
          '<span>' + catLabels[item.category] + " • " + (index + 1) + " / " + list.length + "</span>" +
          '<button class="auto-toggle ' + (autoVideoMode ? "on" : "") + '" onclick="toggleAutoVideo()">' +
            (autoVideoMode ? "▶ Auto Video: ON" : "⏸ Auto Video: OFF") +
          "</button>" +
        "</div>" +
        '<div class="photo-box">' +
          '<img src="' + item.img + '" alt="' + item.engName + '" onerror="handleImgError(this, \'' + item.engName.replace(/'/g, "\\'") + '\', \'' + item.hindiName.replace(/'/g, "\\'") + '\');" />' +
        "</div>" +
        '<div class="question-box">' +
          '<div class="q-hindi">ये क्या है प्यारे बच्चों?</div>' +
        "</div>" +
        '<div class="answer-box ' + (showAns ? "show" : "") + '">' +
          '<div class="a-hindi">ये ' + item.hindiName + " है</div>" +
          '<div class="a-eng">' + item.engName + "</div>" +
        "</div>" +
        '<div class="controls">' +
          '<button class="btn btn-replay" onclick="playVideoSequence()">🔊 फिर से सुनें</button>' +
          '<button class="btn btn-next" onclick="stepNext()">Next →</button>' +
        "</div>";
    }

    if (window.speechSynthesis && window.speechSynthesis.addEventListener) {
      window.speechSynthesis.addEventListener("voiceschanged", function () {});
    }

    renderCategories();
    renderCard();
  </script>
</body>
</html>
